name: One-off - script de servidor

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Ruta de un script YA subido en campus-api/ (dejar vacío si usas "code")'
        required: false
        default: ''
      code:
        description: 'Código PHP a correr directo, sin necesidad de subir nada (dejar vacío si usas "script")'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Run inline code
        if: ${{ github.event.inputs.code != '' }}
        run: |
          cat > /tmp/one-off.php <<'PHPEOF'
          <?php
          ${{ github.event.inputs.code }}
          PHPEOF
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts \
            /tmp/one-off.php ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/campus-api/scripts/_tmp-one-off.php
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "php ${{ secrets.DEPLOY_PATH }}/campus-api/scripts/_tmp-one-off.php; rm -f ${{ secrets.DEPLOY_PATH }}/campus-api/scripts/_tmp-one-off.php"

      - name: Run existing script
        if: ${{ github.event.inputs.script != '' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "php ${{ secrets.DEPLOY_PATH }}/campus-api/${{ github.event.inputs.script }}"
