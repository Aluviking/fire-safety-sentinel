name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.private' \
            --exclude='DO_NOT_UPLOAD_HERE' \
            --exclude='api' \
            --exclude='campus-api' \
            --exclude='private_uploads' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Deploy Campus Virtual backend via rsync
        run: |
          # Sin --delete a propósito: config.php vive SOLO en el servidor (no
          # está en git), y --delete lo borraría en cada despliegue porque no
          # existe en el checkout local que se está sincronizando.
          rsync -avz \
            --exclude='backup-fuente' \
            --exclude='config.php' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts" \
            campus-virtual/backend/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/campus-api

      - name: Deploy Portal Empresarial backend (api/) via rsync
        run: |
          # api/ nunca se desplegaba automáticamente (estaba excluido arriba
          # para no pisar api/config.php, que vive solo en el servidor). Por
          # eso el fix de zona horaria no había llegado a producción. Igual
          # que con campus-api: sin --delete, y sin tocar config.php.
          rsync -avz \
            --exclude='config.php' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts" \
            api/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/api
